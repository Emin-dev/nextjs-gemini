name: Verify application

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Check dependency advisories
        run: npm audit --audit-level=low
      - name: Build production app
        run: npm run build
      - name: Check TypeScript
        run: npm run typecheck
      - name: Install isolated Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Test local application
        run: npm run test:smoke
      - name: Report outstanding lint validation
        run: echo "::warning::Lint remains blocked by the unpatched braces advisory in the compatible Next.js 15 tooling. See VERIFICATION.md. No lint pass is claimed."
